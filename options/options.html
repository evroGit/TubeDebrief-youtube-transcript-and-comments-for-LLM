<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Copy for LLM — Settings</title>
  <style>
    body {
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      max-width: 480px;
      margin: 24px auto;
      font-size: 14px;
      color: #222;
    }
    h1 {
      font-size: 18px;
    }
    label {
      display: block;
      margin-bottom: 14px;
    }
    label span {
      display: block;
      margin-bottom: 4px;
      color: #555;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    input[type="number"], select, input[type="text"], textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      font-size: 14px;
      font-family: inherit;
    }
    textarea {
      resize: vertical;
      min-height: 220px;
      line-height: 1.4;
    }
    .hint {
      font-size: 12px;
      color: #777;
      margin-top: 4px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    button {
      padding: 8px 18px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background: #065fd4;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button.secondary {
      color: #065fd4;
      background: #fff;
      border: 1px solid #ccc;
      font-weight: 500;
    }
    #saved {
      margin-left: 10px;
      color: #2e7d32;
    }
  </style>
</head>
<body>
  <h1 data-i18n="optionsTitle">Copy for LLM — настройки</h1>

  <label>
    <span data-i18n="labelLanguage">Язык интерфейса и prompt</span>
    <select id="uiLanguage">
      <option value="ru">Русский</option>
      <option value="en">English</option>
      <option value="de">Deutsch</option>
    </select>
  </label>

  <hr style="border:none;border-top:1px solid #eee;margin:18px 0;" />

  <label>
    <span data-i18n="labelContentSource">Что собирать</span>
    <select id="contentSource">
      <option value="comments" data-i18n="sourceComments">Комментарии</option>
      <option value="transcript" data-i18n="sourceTranscript">Транскрипт</option>
      <option value="both" data-i18n="sourceBoth">Транскрипт + комментарии</option>
    </select>
  </label>

  <label class="comment-setting">
    <span data-i18n="labelMinChars">Min length (символов)</span>
    <input type="number" id="minChars" min="0" />
  </label>

  <label class="comment-setting">
    <span data-i18n="labelMinWords">Min words</span>
    <input type="number" id="minWords" min="0" />
  </label>

  <label class="comment-setting">
    <span data-i18n="labelMaxComments">Max comments</span>
    <input type="number" id="maxComments" min="1" />
  </label>

  <label class="comment-setting">
    <span data-i18n="labelMaxTotalChars">Max total characters</span>
    <input type="number" id="maxTotalChars" min="1000" />
  </label>

  <div class="row comment-setting">
    <input type="checkbox" id="includeReplies" />
    <label for="includeReplies" style="margin:0;" data-i18n="labelIncludeReplies">Include replies</label>
  </div>

  <label class="transcript-setting">
    <span data-i18n="labelTimestampInterval">Таймкод раз в N секунд (0 — без таймкодов)</span>
    <input type="number" id="transcriptTimestampInterval" min="0" />
    <div class="hint" data-i18n="hintTimestampInterval"></div>
  </label>

  <label class="transcript-setting">
    <span data-i18n="labelMaxTranscriptChars">Max characters транскрипта</span>
    <input type="number" id="maxTranscriptChars" min="1000" />
    <div class="hint" data-i18n="hintMaxTranscriptChars"></div>
  </label>

  <label>
    <span data-i18n="labelCustomUrl">Custom URL (для кнопки "Open Custom")</span>
    <input type="text" id="customLLMUrl" placeholder="https://..." />
  </label>

  <label>
    <!-- Text is set by applyTranslations() from the selected source, not via
         data-i18n, since the key itself changes with the source. -->
    <span id="prompt-label">Prompt для LLM (комментарии)</span>
    <textarea id="promptTemplate" spellcheck="false" data-source="comments"></textarea>
    <textarea id="transcriptPromptTemplate" spellcheck="false" data-source="transcript"></textarea>
    <textarea id="combinedPromptTemplate" spellcheck="false" data-source="both"></textarea>
    <div class="hint" data-i18n="hintPromptTemplate"></div>
  </label>

  <button id="reset-prompt" class="secondary" type="button" data-i18n="buttonResetPrompt">Восстановить prompt по умолчанию</button>

  <hr style="border:none;border-top:1px solid #eee;margin:18px 0;" />

  <button id="save" data-i18n="buttonSave">Сохранить</button>
  <span id="saved"></span>

  <script src="../core/i18n.js"></script>
  <script src="../core/storage.js"></script>
  <script src="options.js"></script>
</body>
</html>
