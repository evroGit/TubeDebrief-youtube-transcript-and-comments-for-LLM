<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>TubeDebrief</title>
  <style>
    body {
      width: 280px;
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      font-size: 13px;
      padding: 12px;
      margin: 0;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 10px;
    }
    label {
      display: block;
      margin-bottom: 8px;
    }
    label span {
      display: block;
      margin-bottom: 2px;
      color: #555;
    }
    input[type="number"], input[type="text"], select {
      width: 100%;
      box-sizing: border-box;
      padding: 4px 6px;
      font-size: 13px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
    }
    button#copy-button {
      width: 100%;
      padding: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background: #065fd4;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 4px;
    }
    button#copy-button:disabled {
      opacity: 0.6;
      cursor: default;
    }
    .open-targets {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    .open-targets button {
      flex: 1 1 calc(50% - 6px);
      padding: 6px 4px;
      font-size: 13px;
      color: #065fd4;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 6px;
      cursor: pointer;
    }
    .open-targets button:disabled {
      opacity: 0.5;
      cursor: default;
    }
    #copy-check {
      display: none;
      color: #fff;
      font-weight: 700;
    }
    #status {
      margin-top: 8px;
      min-height: 16px;
    }
    #options-link {
      display: block;
      margin-top: 10px;
      text-align: center;
      font-size: 12px;
    }
    hr {
      border: none;
      border-top: 1px solid #eee;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <h1 data-i18n="popupTitle">TubeDebrief</h1>

  <label>
    <span data-i18n="labelContentSource">Что собирать</span>
    <select id="contentSource">
      <option value="comments" data-i18n="sourceComments">Комментарии</option>
      <option value="transcript" data-i18n="sourceTranscript">Транскрипт</option>
      <option value="both" data-i18n="sourceBoth">Транскрипт + комментарии</option>
    </select>
  </label>

  <label class="comment-setting">
    <span data-i18n="labelMinChars">Min length (символов)</span>
    <input type="number" id="minChars" min="0" />
  </label>

  <label class="comment-setting">
    <span data-i18n="labelMaxComments">Max comments</span>
    <input type="number" id="maxComments" min="1" />
  </label>

  <div class="row comment-setting">
    <input type="checkbox" id="includeReplies" />
    <label for="includeReplies" style="margin:0;" data-i18n="labelIncludeReplies">Include replies</label>
  </div>

  <button id="copy-button"><span data-i18n="buttonCopy">Copy</span><span id="copy-check"> ✓</span></button>

  <hr />

  <div class="open-targets">
    <button data-target="chatgpt" disabled>ChatGPT</button>
    <button data-target="claude" disabled>Claude</button>
    <button data-target="gemini" disabled>Gemini</button>
    <button data-target="perplexity" disabled>Perplexity</button>
    <button data-target="deepseek" disabled>DeepSeek</button>
  </div>

  <div id="status"></div>

  <a href="#" id="options-link" data-i18n="linkMoreSettings">Больше настроек</a>

  <script src="../core/i18n.js"></script>
  <script src="../core/storage.js"></script>
  <script src="../core/targets.js"></script>
  <script src="../core/openTarget.js"></script>
  <script src="popup.js"></script>
</body>
</html>
